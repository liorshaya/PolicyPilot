# Test-only values for the demo secrets, loaded on top of the main application.yml (Spring Boot reads
# classpath:/config/application.yml after classpath:/application.yml). Deliberately not secret-shaped.
policypilot:
  access-code: testcode
  cookie-secret: not-a-secret-only-for-the-tests-of-policypilot
  admin-code: not-the-admin-code-only-for-tests
  demo:
    # the nightly reset never fires inside a test run; ResetIT calls the job itself
    reset-cron: "-"
