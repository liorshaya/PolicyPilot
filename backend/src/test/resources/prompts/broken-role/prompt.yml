role: rule author
task: do the thing
outputSchema: schemas/ruleset-1.0.schema.json
modelRole: gpt-5.6-terra
temperature: 0.0
maxOutputTokens: 8000
timeoutSeconds: 60
repairs: 2
cache: by-input-hash
languages: [en]
