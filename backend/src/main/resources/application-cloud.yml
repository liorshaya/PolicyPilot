# Railway profile, always combined with a provider profile: SPRING_PROFILES_ACTIVE=openai,cloud
server:
  # TLS is terminated by Railway; honour X-Forwarded-Proto so redirects and cookies see https (Document 5, Transport)
  forward-headers-strategy: native

management:
  endpoint:
    health:
      show-details: never

policypilot:
  ai:
    log-payloads: false
