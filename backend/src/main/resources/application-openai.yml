# OpenAI provider profile (Document 2, Configuration and Model Providers, "openai" column).
# Property paths are the flat ones of Spring AI 2.0 (upgrade notes cited in Document 2).
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${policypilot.ai.models.strong}
        # No temperature here: the adapter sends the one the prompt asks for, and the strong model of this
        # lineup accepts only its own, so the author prompt sends none at all (Document 4).
      embedding:
        model: text-embedding-3-small
        dimensions: 1536

policypilot:
  ai:
    models:
      strong: gpt-5.6-terra
      fast: gpt-5.6-luna
  embedding:
    dimension: 1536
