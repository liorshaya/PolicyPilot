# PolicyPilot backend, base configuration (Document 2, Configuration and Model Providers).
# Profiles: openai (default provider), ollama (local provider), cloud (Railway only). Secrets come from
# environment variables only; this file lists names and defaults, never values (Document 5, Data Protection).
spring:
  application:
    name: policypilot
  datasource:
    # Docker Compose and Railway provide DATABASE_URL as postgresql://user:password@host:5432/db;
    # DatabaseUrlEnvironmentPostProcessor translates it. The defaults below serve a bare local PostgreSQL.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/policypilot}
    username: ${DATABASE_USERNAME:policypilot}
    password: ${DATABASE_PASSWORD:policypilot}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      # Every API connection runs as the role V4 creates, which holds only the grants the API needs: no update or
      # delete on audit_entry, no delete on ruleset_version (Document 5, principle 1; Document 2, Data Model)
      connection-init-sql: SET ROLE policypilot_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations connect on their own, as the login role that owns the tables, not through the pool above
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # No user store: the only credential is the access code, exchanged for the signed cookie (Document 5)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      # One policy file of at most 2 MB per request, kept in memory: nothing uploaded is ever written to disk
      # (Document 5, File and path injection; limits table: uploads 2 MB)
      max-file-size: 2MB
      max-request-size: 2112KB
      file-size-threshold: 3MB
  jackson:
    deserialization:
      # Unknown properties are an error on every request body (Document 5, JSON and deserialization)
      fail-on-unknown-properties: true
  ai:
    # PolicyPilot uses chat and embedding models only; the provider profiles select them. Every other
    # model type the starters could configure is switched off so no profile needs credentials it does not use.
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  structured:
    format:
      # JSON logs in every profile: values are JSON-encoded, so a newline or an escape sequence in a logged value
      # cannot forge a line (Document 5, log injection); the customizer masks secrets (Document 5, Redaction)
      console: ecs
    json:
      customizer: com.liorshaya.policypilot.config.logging.RedactingJsonMembersCustomizer

springdoc:
  # The OpenAPI document and its UI, behind the session cookie like every /api/** route (Document 5)
  # override-with-generic-response off: the error envelope is documented per route, and the advice's handlers
  # must not replace the response a route actually returns (Document 6, Contract level)
  override-with-generic-response: false
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

management:
  endpoints:
    web:
      exposure:
        # Only the health check is public (Document 5, Health and docs endpoints)
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

policypilot:
  # The three demo secrets, from environment variables only; the application refuses to start without the first two.
  access-code: ${POLICYPILOT_ACCESS_CODE:}
  cookie-secret: ${POLICYPILOT_COOKIE_SECRET:}
  admin-code: ${POLICYPILOT_ADMIN_CODE:}
  web:
    # The CORS allowlist and the Origin check (Document 5, CSRF); the cloud profile names the Vercel domain
    allowed-origins: http://localhost:5173
  rate-limit:
    per-minute: 20
    per-sandbox-per-hour: 60
    concurrent-streams: 3
  ai:
    models:
      strong: gpt-5.6-terra
      fast: gpt-5.6-luna
    prompt-versions:
      author: v1
      review: v1
      explain: v1
      answer: v1
      change: v1
    timeouts:
      # A prompt's own timeout, token cap and temperature live in its prompt.yml (Document 2);
      # this one is the chat stream's deadline, which belongs to the stream and not to one call.
      chat-first-token-seconds: 20
    max-repair-attempts: 2
    # The owner capped OpenAI at 5 USD a day (2026-09-18). At the dearest price in the lineup on 2026-09-20,
    # the strong model's output at 12 USD per million tokens, 400,000 tokens cost 4.80 USD, so the ledger can
    # never spend the day's cap; at the authoring mix of Document 4 (12,000 in, 6,000 out, about 10 cents a run)
    # it is roughly 22 runs a day. Crossing it switches the provider to cache-only, it does not fail the app.
    daily-token-budget: 400000
    log-payloads: false
  embedding:
    dimension: 1536
  rag:
    top-k: 8
    min-score: 0.35
  demo:
    reset-cron: "0 0 3 * * *"
    fixture-set: cases-200
