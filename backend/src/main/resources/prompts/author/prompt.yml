# The author prompt (Document 4, Prompt 1: Author). One call turns numbered paragraphs into a whole RuleSet
# document; everything it produces is validated before anyone sees it.
name: author
active: v2
role: rule author
task: read a policy and express it as fields and rules in the PolicyPilot DSL, citing the paragraph behind every rule
outputSchema: schemas/ruleset-1.0.schema.json
modelRole: strong
# Document 4 asks for 0; the strong model of the current OpenAI lineup accepts only its own
# temperature and refuses any other, so the prompt asks for the model's default and determinism
# comes from the schema and the validator instead.
temperature: default
# The cap counts the model's reasoning tokens as well as the document it returns (Document 4): a
# twelve-paragraph policy measured 2,184 reasoning and 6,379 document tokens, and a run that reasoned
# harder spent all of an 8,000 cap on reasoning and answered nothing at all.
maxOutputTokens: 24000
timeoutSeconds: 180
repairs: 2
cache: by-input-hash
languages: [he, en]
