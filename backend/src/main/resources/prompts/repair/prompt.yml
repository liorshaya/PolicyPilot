# The repair prompt (Document 4, Repair Loop). It reuses the system prompt of the prompt it repairs, so the
# conduct rules and the cheat sheet still apply, and it is never cached and never repaired itself.
name: repair
active: v1
role: rule author
task: fix only the validation problems listed and return the complete corrected document
outputSchema: schemas/ruleset-1.0.schema.json
modelRole: strong
temperature: 0.0
maxOutputTokens: 8000
timeoutSeconds: 60
repairs: 0
cache: none
languages: [he, en]
