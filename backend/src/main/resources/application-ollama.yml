# Local provider profile (Document 2, Configuration and Model Providers, "ollama" column).
# Docker Compose reaches the ollama service by name; set OLLAMA_BASE_URL when Ollama runs on the host.
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      init:
        # Models are pulled by scripts/ollama/pull-models.sh (compose service ollama-pull), never at startup
        pull-model-strategy: never
      chat:
        # qwen3:14b is the alternative for a machine with less than 32 GB of memory (Document 4, The local chat model)
        model: qwen3:30b-a3b-instruct-2507-q4_K_M
        # Thinking off by default and for every prompt that returns JSON; the adapter turns it on for the answer, which
        # streams text (Document 4, Thinking on the local model), and this model, having no thinking mode, ignores it
        think: false
        temperature: 0
      embedding:
        model: bge-m3

policypilot:
  ai:
    models:
      strong: qwen3:30b-a3b-instruct-2507-q4_K_M
      fast: qwen3:30b-a3b-instruct-2507-q4_K_M
    # qwen3:14b writes about 27 tokens a second on the M1 Max that measured it, a third of the strong OpenAI model's
    # pace, so each prompt gets longer (Document 4, Model Configuration per Prompt; decided on day 15); the chat model
    # since day 16 writes about 69 a second on the same machine, so the timeouts stand as upper bounds
    timeouts:
      chat-first-token-seconds: 90
      prompt-seconds:
        author: 600
        review: 600
        change: 300
        explain: 180
        answer: 300
  embedding:
    dimension: 1024
  rag:
    # bge-m3's cosines run higher than text-embedding-3-small's: 0.58 is the lowest value that stops the demo's rate
    # question, Q-04 at 0.572 (Document 4, Retrieval Pipeline: The threshold per embedding model; day 16)
    min-score: 0.58
