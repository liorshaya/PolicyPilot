# Live evaluation (Document 6, CI Pipeline): a manual workflow, never a required check, because it needs the
# provider key and is non-deterministic. It runs the offline admission check of the evaluation set, then the
# EvalRunner (Document 4, Runner), which scores the recorded passes and writes docs/eval/<date>-<versions>.md.
# The runner itself needs no key: it reads fixtures/eval/recordings/. A pass that creates new recordings is a
# @Tag("live") test of its own and is started by hand, never by this workflow.
name: Evaluation (manual)

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  admission:
    name: evaluation-set-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The 18 labeled policies, 30 questions and 6 change requests are admitted by the reference
        run: |
          pip install --quiet "jsonschema==4.25.1"
          python3 fixtures/reference/reference_check.py | tee reference-check.log
          grep -q 'evaluation set OK' reference-check.log
          tail -n 1 reference-check.log | grep -qx 'ALL OK'

  runner:
    name: evaluation-runner
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Score the recorded passes and write the report
        working-directory: backend
        run: ./mvnw --batch-mode -Peval test -Dprovider=openai -Deval.date="$(date -u +%F)"
      - name: The report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-report
          path: docs/eval/*.md
